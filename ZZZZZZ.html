<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Planet Outro</title>
<style>
  :root { --ice: #cfe6f2; --text: #d7e4ea; --dim: #6f8590; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc((100vh - 46px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #play { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); font: inherit; font-size: clamp(10px, 1.05vw, 13px); letter-spacing: .28em;
    color: #fff; background: rgba(4, 10, 18, .45); border: 1px solid rgba(255, 255, 255, .55); padding: .8em 1.5em; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity .4s, background .2s; }
  #play:hover { background: rgba(255, 255, 255, .16); }
  #play.hidden { opacity: 0; pointer-events: none; }
  #bar { width: min(100vw, calc((100vh - 46px) * 16 / 9)); height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 12px; color: var(--dim); }
  #bar button { font: inherit; color: var(--text); background: none; border: 1px solid #25343d; padding: 4px 12px; cursor: pointer; }
  #bar button:hover { border-color: var(--ice); color: var(--ice); }
  #track { flex: 1; height: 2px; background: #151f26; position: relative; min-width: 40px; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ice); }
  #label { white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="play">▶ PLAY / UNMUTE</button>
</div>
<div id="bar">
  <button id="replay">Play</button>
  <button id="mute">Sound: on</button>
  <div id="track"><div id="fill"></div></div>
  <span id="label">0:00 / 0:30</span>
</div>

<script>
(() => {
'use strict';
const W = 1280, H = 720, DUR = 30, BAR = 62;
const T_CAST = 6, SHOT = 3, T_ORBIT = 24, T_DOWN = 4.0;
const CREDIT = 'Created by Bodner, Casden, Maryles, A Stahl, D Stahl, Solemanzadeh';
const SERIF = '"Didot","Bodoni 72","Hoefler Text","Baskerville","Cormorant Garamond","Times New Roman",serif';
const cv = document.getElementById('c'), g = cv.getContext('2d');
const stage = document.getElementById('stage');
let scale = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), r = stage.getBoundingClientRect();
  cv.width = Math.max(2, Math.round(r.width * dpr)); cv.height = Math.max(2, Math.round(r.height * dpr)); scale = cv.width / W;
}
addEventListener('resize', resize); resize();

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const spaced = (s, sp) => s.split('').join(sp);

/* ---------- stills lifted from the reference clip (video_1.mp4) ----------
   Each shot is captured once at load. The titles burned into the clip are lifted out with a
   min-then-max filter (thin bright strokes vanish, what is behind them stays), feathered at the edges. */
const STILLS = {
  mtn:  { at: 0.30, txt: [0.105, 0.345, 0.40, 0.175] },
  cam:  { at: 1.45, txt: [0.745, 0.405, 0.23, 0.165] },
  coop: { at: 2.90, txt: [0.730, 0.405, 0.21, 0.165] },
  ej:   { at: 4.05, txt: [0.640, 0.455, 0.245, 0.17] },
  tars: { at: 4.62, txt: [0.645, 0.365, 0.22, 0.165] }
};
const stills = {};
function liftText(c, r) {
  const x = c.getContext('2d'), VW = c.width, VH = c.height;
  const rx = Math.round(r[0] * VW), ry = Math.round(r[1] * VH), rw = Math.round(r[2] * VW), rh = Math.round(r[3] * VH), d = Math.max(4, Math.round(VW / 200));
  const pa = document.createElement('canvas'), pb = document.createElement('canvas'); pa.width = pb.width = rw; pa.height = pb.height = rh;
  const pax = pa.getContext('2d'), pbx = pb.getContext('2d'), ring = [];
  for (const q of [d, d * 0.55]) for (let i = 0; i < 8; i++) ring.push([Math.cos(i * Math.PI / 4) * q, Math.sin(i * Math.PI / 4) * q]);
  pax.drawImage(c, rx, ry, rw, rh, 0, 0, rw, rh);
  pax.globalCompositeOperation = 'darken'; for (const [ox, oy] of ring) pax.drawImage(c, rx, ry, rw, rh, ox, oy, rw, rh);
  pbx.drawImage(pa, 0, 0);
  pbx.globalCompositeOperation = 'lighten'; for (const [ox, oy] of ring) pbx.drawImage(pa, ox, oy);
  pbx.globalCompositeOperation = 'destination-in';
  const f = 24 / rw, fv = 20 / rh;
  let m = pbx.createLinearGradient(0, 0, rw, 0); m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(f, '#000'); m.addColorStop(1 - f, '#000'); m.addColorStop(1, 'rgba(0,0,0,0)');
  pbx.fillStyle = m; pbx.fillRect(0, 0, rw, rh);
  m = pbx.createLinearGradient(0, 0, 0, rh); m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(fv, '#000'); m.addColorStop(1 - fv, '#000'); m.addColorStop(1, 'rgba(0,0,0,0)');
  pbx.fillStyle = m; pbx.fillRect(0, 0, rw, rh);
  x.drawImage(pb, rx, ry);
}
(async () => {
  const v = document.createElement('video'); v.src = 'video_1.mp4'; v.muted = true; v.playsInline = true; v.preload = 'auto';
  try {
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = rej; });
    for (const [name, s] of Object.entries(STILLS)) {
      await new Promise(res => { v.onseeked = res; v.currentTime = s.at; });
      await new Promise(res => setTimeout(res, 220));
      const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0); liftText(c, s.txt); stills[name] = c;
    }
  } catch (e) { /* clip missing: shots fall back to a plain sky */ }
})();
/* draw a crop of a still: x, y, w are fractions of the frame (the crop keeps 16:9) */
function drawStill(name, x, y, w) {
  const c = stills[name]; if (!c) { fallbackSky(); return; }
  w = clamp(w, 0.2, 1); x = clamp(x, 0, 1 - w); y = clamp(y, 0, 1 - w);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(c, x * c.width, y * c.height, w * c.width, w * c.height, 0, 0, W, H);
}

/* optional portraits: frames/<name>.jpg or .png replaces that person's shot */
const frames = {};
for (const n of ['alex', 'akiva', 'judah', 'ej', 'daniel', 'david']) {
  const im = new Image(); let second = false;
  im.onload = () => { frames[n] = im; };
  im.onerror = () => { if (!second) { second = true; im.src = `frames/${n}.jpg`; } };
  im.src = `frames/${n}.png`;
}

/* ---------- cast: which still each person appears over, and the slow move across it [x0, y0, w0, x1, y1, w1] ---------- */
const CAST = [
  { k: 'alex',   name: 'Alex',   jobs: ['Executive Director', 'Editor', 'Dr Mann'],                     still: 'mtn',  mv: [0.00, 0.00, 1.00, 0.03, 0.02, 0.94] },
  { k: 'akiva',  name: 'Akiva',  jobs: ['Director of Photography', 'Scriptwriter'],                     still: 'mtn',  mv: [0.00, 0.30, 0.66, 0.03, 0.32, 0.60] },
  { k: 'judah',  name: 'Judah',  jobs: ['Camera Operator 2', 'TARS / CASE'],                            still: 'tars', mv: [0.00, 0.03, 0.94, 0.04, 0.05, 0.89] },
  { k: 'ej',     name: 'EJ',     jobs: ['Director', 'Brand'],                                           still: 'ej',   mv: [0.05, 0.03, 0.94, 0.00, 0.05, 0.89] },
  { k: 'daniel', name: 'Daniel', jobs: ['Producer', 'Scriptwriter', 'Casting Director', 'Romilly'],     still: 'cam',  mv: [0.00, 0.04, 0.93, 0.05, 0.04, 0.89] },
  { k: 'david',  name: 'David',  jobs: ['Cooper'],                                                      still: 'coop', mv: [0.06, 0.03, 0.94, 0.00, 0.05, 0.88] }
];

const R0 = rng(11);
const stars = Array.from({ length: 260 }, () => ({ x: R0() * W, y: R0() * H, r: 0.4 + R0() * 1.3, a: 0.3 + R0() * 0.7 }));
const flakes = Array.from({ length: 170 }, () => ({ x: R0() * W, y: R0() * H, vx: 150 + R0() * 280, vy: 25 + R0() * 70, s: 0.5 + R0() * 1.6, p: R0() * 6.28 }));
const puffs = Array.from({ length: 46 }, () => ({ tb: 2.5 + R0() * 2.0, dir: R0() < 0.5 ? -1 : 1, v: 50 + R0() * 230, up: 6 + R0() * 46, r: 16 + R0() * 26, gr: 30 + R0() * 60, life: 1.6 + R0() * 1.6 }));

function glow(x, y, r, rgb, a, sy = 1, mode = 'lighter') {
  if (a <= 0) return; g.save(); g.globalCompositeOperation = mode; g.translate(x, y); g.scale(1, sy);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(-r, -r, r * 2, r * 2); g.restore();
}
function snow(clk, amt) {
  if (amt <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  for (const f of flakes) {
    const x = ((f.x + clk * f.vx + Math.sin(clk * 1.3 + f.p) * 22) % (W + 60) + W + 60) % (W + 60) - 30;
    const y = ((f.y + clk * f.vy) % (H + 20) + H + 20) % (H + 20) - 10;
    g.strokeStyle = `rgba(236,244,250,${(0.12 + 0.18 * f.s / 2.1) * amt})`; g.lineWidth = f.s;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - f.vx * 0.03, y - f.vy * 0.03); g.stroke();
  }
  g.restore();
}
function fallbackSky() { const s = g.createLinearGradient(0, 0, 0, H); s.addColorStop(0, '#20262e'); s.addColorStop(0.5, '#6d7a86'); s.addColorStop(1, '#2b3540'); g.fillStyle = s; g.fillRect(0, 0, W, H); }

/* ---------- lander ---------- */
const LX = 838, LY = 436;
function poly(pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function lander(x, y, s, tilt, hot, legs, ramp) {
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(tilt);
  /* landing legs */
  if (legs > 0) { g.strokeStyle = '#2b3138'; g.lineWidth = 2.6; g.lineCap = 'round';
    for (const lx of [-62, 4, 66]) { g.beginPath(); g.moveTo(lx * 0.9, -12); g.lineTo(lx, -12 + 12 * legs); g.stroke(); g.fillStyle = '#20252b'; g.fillRect(lx - 5, -1.5 + (legs - 1) * 12, 10, 2.5); } }
  /* ramp with warm cabin light */
  if (ramp > 0) { g.fillStyle = '#1c2228'; poly([[-34, -12], [-18, -12], [-22, -12 + 12 * ramp], [-46, -12 + 12 * ramp]]); g.fill();
    g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = `rgba(255,214,150,${0.85 * ramp})`; g.fillRect(-33, -17, 14, 5); g.restore(); }
  /* underside */
  const un = g.createLinearGradient(0, -30, 0, -8); un.addColorStop(0, '#5d666f'); un.addColorStop(1, '#262c33');
  g.fillStyle = un; poly([[-92, -29], [-74, -17], [44, -19], [94, -27], [72, -11], [-60, -9]]); g.fill();
  /* upper hull: flat, angular lifting body lit from the upper left */
  const top = g.createLinearGradient(-90, -52, 90, -18); top.addColorStop(0, '#f3f1ec'); top.addColorStop(0.5, '#c9ccce'); top.addColorStop(1, '#7c858d');
  g.fillStyle = top; poly([[-92, -29], [-64, -45], [-8, -53], [38, -51], [84, -38], [94, -27], [44, -19], [-74, -17]]); g.fill();
  /* facets and panel lines */
  g.fillStyle = 'rgba(255,255,255,0.22)'; poly([[-64, -45], [-8, -53], [-2, -36], [-70, -30]]); g.fill();
  g.fillStyle = 'rgba(20,26,34,0.2)'; poly([[38, -51], [84, -38], [94, -27], [44, -19], [30, -34]]); g.fill();
  g.strokeStyle = 'rgba(40,48,56,0.5)'; g.lineWidth = 0.7; g.beginPath();
  for (const [a, b, c, d] of [[-70, -30, 30, -34], [-2, -36, -8, -53], [30, -34, 38, -51], [-40, -18, -36, -33], [10, -19, 12, -35], [-74, -17, -92, -29]]) { g.moveTo(a, b); g.lineTo(c, d); }
  g.stroke();
  /* cockpit glazing */
  g.fillStyle = '#0b1016'; poly([[-84, -31], [-66, -41], [-44, -44], [-50, -33]]); g.fill();
  g.strokeStyle = 'rgba(170,200,225,0.55)'; g.lineWidth = 0.6; g.beginPath(); g.moveTo(-70, -39); g.lineTo(-64, -32); g.moveTo(-57, -42.5); g.lineTo(-55, -33); g.stroke();
  /* nozzles and thruster plumes */
  g.fillStyle = '#14181d'; for (const nx of [-50, -8, 34, 70]) g.fillRect(nx - 5, -13, 10, 4);
  if (hot > 0) { g.save(); g.globalCompositeOperation = 'lighter';
    for (const nx of [-50, -8, 34, 70]) { const L = (52 + 26 * Math.sin(performance.now() / 23 + nx)) * hot, pg = g.createLinearGradient(0, -9, 0, -9 + L);
      pg.addColorStop(0, `rgba(235,246,255,${0.95 * hot})`); pg.addColorStop(0.35, `rgba(140,195,255,${0.5 * hot})`); pg.addColorStop(1, 'rgba(120,170,255,0)');
      g.fillStyle = pg; poly([[nx - 4, -9], [nx + 4, -9], [nx + 11, -9 + L], [nx - 11, -9 + L]]); g.fill(); }
    g.restore(); }
  g.restore();
}
function walker(x, y, h, phase, a) {
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.translate(x, y);
  g.fillStyle = 'rgba(8,12,18,0.35)'; g.beginPath(); g.ellipse(h * 0.5, h * 0.22, h * 0.6, h * 0.1, 0.5, 0, 7); g.fill();
  g.strokeStyle = '#0d1218'; g.lineCap = 'round'; g.lineWidth = h * 0.14; const sw = Math.sin(phase) * h * 0.13;
  g.beginPath(); g.moveTo(0, -h * 0.42); g.lineTo(-sw, 0); g.moveTo(0, -h * 0.42); g.lineTo(sw, 0); g.stroke();
  g.lineWidth = h * 0.3; g.beginPath(); g.moveTo(0, -h * 0.8); g.lineTo(0, -h * 0.42); g.stroke();
  g.fillStyle = '#0d1218'; g.beginPath(); g.arc(0, -h * 0.92, h * 0.1, 0, 7); g.fill();
  g.restore();
}

/* ---------- 0:00–0:06 descent and touchdown ---------- */
function sceneLanding(t, clk) {
  const k = seg(t, 0.2, T_DOWN), d = 1 - Math.pow(1 - k, 2.1), alt = 1 - d;
  const sh = 3.2 * (t < T_DOWN ? 0.35 + 0.65 * k : 1 - seg(t, T_DOWN, T_DOWN + 0.7));
  g.save(); g.translate(Math.sin(clk * 43) * sh, Math.cos(clk * 51) * sh);
  g.translate(640, 360); g.scale(1.03, 1.03); g.translate(-640, -360);
  drawStill('mtn', 0, 0, 1);
  const x = lerp(1010, LX, d) + Math.sin(clk * 1.7) * 5 * alt, y = lerp(-70, LY, d), s = lerp(0.5, 1, d);
  /* shadow and thruster wash on the snow */
  g.fillStyle = `rgba(10,16,24,${0.42 * Math.pow(d, 3)})`; g.beginPath(); g.ellipse(LX + 26 * alt, LY + 4, 96 * (1 - 0.3 * alt), 9, 0, 0, 7); g.fill();
  const hot = t < T_DOWN ? 1 : 1 - seg(t, T_DOWN, T_DOWN + 0.9);
  glow(LX, LY, 240, '205,228,255', 0.5 * hot * Math.pow(d, 4), 0.2);
  /* kicked-up snow behind the craft */
  for (const p of puffs) { if (p.dir > 0) continue; const age = t - p.tb; if (age < 0 || age > p.life) continue; const u = age / p.life;
    glow(LX + p.dir * p.v * (1 - Math.exp(-age * 1.4)), LY - 4 - p.up * u, p.r + p.gr * u, '232,238,244', 0.34 * (1 - u) * Math.min(1, age * 5), 0.55, 'source-over'); }
  lander(x, y, s, lerp(-0.13, 0, d) + Math.sin(clk * 2.3) * 0.02 * alt, hot, seg(t, 2.4, 3.6), ease(seg(t, 4.35, 4.9)));
  glow(x, y - 6 * s, 30 * s, '255,170,90', 0.55 * (1 - hot) * (1 - seg(t, 4.9, 6)), 0.5);
  for (const p of puffs) { if (p.dir < 0) continue; const age = t - p.tb; if (age < 0 || age > p.life) continue; const u = age / p.life;
    glow(LX + p.dir * p.v * (1 - Math.exp(-age * 1.4)), LY - 2 - p.up * u, p.r + p.gr * u, '236,241,246', 0.34 * (1 - u) * Math.min(1, age * 5), 0.55, 'source-over'); }
  /* crew stepping off onto the ice */
  for (let i = 0; i < 6; i++) { const wt = t - (4.75 + i * 0.19); if (wt < 0) continue;
    walker(LX - 40 - wt * (15 + i * 1.3) - i * 2, LY + 2 + wt * (6 + (i % 3) * 2.2), 15 + wt * 1.6, wt * 9 + i, seg(wt, 0, 0.25)); }
  /* icy cloud deck the craft drops through */
  for (let i = 0; i < 9; i++) glow(((i * 331 + clk * (22 + i * 6)) % (W + 800)) - 400, -20 + (i % 4) * 46, 360, '208,216,226', (0.5 - 0.035 * i) * (1 - 0.75 * seg(t, 1.2, 4.6)), 0.4, 'source-over');
  g.restore();
}

/* ---------- 0:06–0:24 crew ---------- */
function sceneCast(i, lt) {
  const c = CAST[i], k = ease(lt / SHOT), m = c.mv;
  if (frames[c.k]) { const im = frames[c.k], s = Math.max(W / im.naturalWidth, H / im.naturalHeight) * (1.04 + 0.05 * k), dw = im.naturalWidth * s, dh = im.naturalHeight * s;
    g.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh); }
  else drawStill(c.still, lerp(m[0], m[3], k), lerp(m[1], m[4], k), lerp(m[2], m[5], k));
}
/* title card in the reference clip's style: tracked serif capitals, name over roles, set in the lower third */
function lowerThird(c, lt) {
  const a = Math.min(seg(lt, 0.4, 0.95), 1 - seg(lt, SHOT - 0.55, SHOT - 0.2)); if (a <= 0) return;
  const X = 1010, LH = 25, bottom = H - BAR - 46, n = c.jobs.length, nameY = bottom - n * LH - 22;
  glow(X, nameY + 30, 330, '2,6,12', 0.6 * a, 0.5 + 0.06 * n, 'source-over');
  g.save(); g.textBaseline = 'alphabetic'; g.textAlign = 'center'; g.shadowColor = 'rgba(0,0,0,0.8)'; g.shadowBlur = 14;
  const rise = (1 - ease(seg(lt, 0.4, 1.0))) * 8;
  g.font = `400 46px ${SERIF}`; g.fillStyle = `rgba(255,255,255,${a})`; g.fillText(spaced(c.name.toUpperCase(), '   '), X, nameY + rise);
  const rule = ease(seg(lt, 0.5, 1.1)) * 46; g.fillStyle = `rgba(255,255,255,${0.6 * a})`; g.fillRect(X - rule / 2, nameY + 15, rule, 1);
  g.font = `400 15px ${SERIF}`; g.fillStyle = `rgba(255,255,255,${0.92 * a})`;
  c.jobs.forEach((j, q) => g.fillText(spaced(j.toUpperCase(), '  '), X, nameY + 44 + q * LH + rise * 0.5));
  g.restore();
}

/* ---------- 0:24–0:30 orbit, Gargantua, credit ---------- */
function blackHole(x0, y0, R, a) {
  if (a <= 0) return;
  g.save(); g.translate(x0, y0); g.rotate(-0.14); g.globalAlpha = a;
  const disk = front => { g.save(); g.globalCompositeOperation = 'lighter'; g.scale(1, 0.12);
    for (let i = 0; i < 6; i++) { const rr = R * (1.45 + i * 0.4), gr = g.createLinearGradient(-rr, 0, rr, 0);
      gr.addColorStop(0, `rgba(255,240,214,${0.6 - i * 0.085})`); gr.addColorStop(0.55, `rgba(255,186,104,${0.42 - i * 0.06})`); gr.addColorStop(1, `rgba(214,112,44,${0.24 - i * 0.035})`);
      g.strokeStyle = gr; g.lineWidth = R * 0.42; g.beginPath(); g.arc(0, 0, rr, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2); g.stroke(); }
    g.restore(); };
  glow(0, 0, R * 5, '255,170,90', 0.2); glow(0, 0, R * 7, '255,200,150', 0.22, 0.1);
  disk(false);
  g.save(); g.globalCompositeOperation = 'lighter'; g.shadowColor = 'rgba(255,170,80,1)'; g.shadowBlur = R * 0.5;
  const hg = g.createLinearGradient(-R * 1.4, 0, R * 1.4, 0); hg.addColorStop(0, 'rgba(255,236,206,0.95)'); hg.addColorStop(1, 'rgba(240,150,70,0.6)');
  g.strokeStyle = hg; g.lineWidth = R * 0.2; g.beginPath(); g.arc(0, 0, R * 1.24, 0, 7); g.stroke();
  g.lineWidth = R * 0.07; g.beginPath(); g.arc(0, 0, R * 1.5, Math.PI * 1.08, Math.PI * 1.92); g.stroke(); g.restore();
  g.fillStyle = '#000'; g.beginPath(); g.arc(0, 0, R * 1.13, 0, 7); g.fill();
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = 'rgba(255,246,228,0.95)'; g.lineWidth = Math.max(1, R * 0.022); g.beginPath(); g.arc(0, 0, R * 1.14, 0, 7); g.stroke(); g.restore();

  g.restore();
}
function sceneOrbit(t) {
  const lt = t - T_ORBIT, k = 1 - Math.pow(1 - seg(lt, 0, 3.6), 2.4);
  g.save(); g.translate(640, 360); g.scale(1 + 0.25 * (1 - k), 1 + 0.25 * (1 - k)); g.translate(-640, -360);
  for (const s of stars) { g.fillStyle = `rgba(225,235,255,${s.a * seg(lt, 0.2, 1.4)})`; g.fillRect(s.x, s.y, s.r, s.r); }
  g.restore();

function render(t, clk) {

  let third = null, dip = 1 - seg(t, 0, 1.2);
  if (t < T_CAST) { sceneLanding(t, clk); dip = Math.max(dip, seg(t, T_CAST - 0.3, T_CAST)); }
  else {
    const i = Math.min(CAST.length - 1, Math.floor((t - T_CAST) / SHOT)), lt = t - (T_CAST + i * SHOT);
    sceneCast(i, lt); third = [CAST[i], lt];
    dip = Math.max(1 - seg(lt, 0.05, 0.4), i < CAST.length - 1 ? seg(lt, SHOT - 0.3, SHOT) : 0);
  }
  const inside = third && !frames[third[0].k] ? ({ coop: 0, ej: 0.2 })[third[0].still] : undefined;
  snow(clk, t < T_CAST ? 0.8 + 0.9 * Math.sin(Math.PI * seg(t, 2.4, 5.6)) : inside !== undefined ? inside : 0.7);
  const vg = g.createRadialGradient(640, 360, 300, 640, 360, 820); vg.addColorStop(0, 'rgba(0,4,10,0)'); vg.addColorStop(1, 'rgba(0,4,10,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  if (third) lowerThird(third[0], third[1]);
  if (dip > 0) { g.fillStyle = `rgba(0,0,0,${dip})`; g.fillRect(0, 0, W, H); }

/* ---------- audio: touchdown effects + organ and piano score (all synthesized) ---------- */
let ac = null, master = null, muted = false;

  F4: 349.23, G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880 };
function startAudio() {

  const conv = ac.createConvolver(), len = Math.floor(ac.sampleRate * 5), ir = ac.createBuffer(2, len, ac.sampleRate);

  conv.buffer = ir; const wet = ac.createGain(); wet.gain.value = 0.42; conv.connect(wet); wet.connect(master);
  const bus = ac.createGain(); bus.connect(master); bus.connect(conv);
  const dry = ac.createGain(); dry.connect(master); mkSend(dry, conv, 0.12);
  function mkSend(src, dest, v) { const s = ac.createGain(); s.gain.value = v; src.connect(s); s.connect(dest); }

  const mk = (v, dest) => { const gn = ac.createGain(); gn.gain.value = v; gn.connect(dest); return gn; };
  env(bus.gain, [[0, 1], [28.6, 1], [29.9, 0]]);

  /* --- lander: low rumble, thruster roar, snow and ice kick-up, touchdown thump, cooling ticks --- */
  const nb = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), nd = nb.getChannelData(0); for (let j = 0; j < nd.length; j++) nd[j] = Math.random() * 2 - 1;

  const D = T_DOWN;
  const [rum] = noise('lowpass', 95, 0.7, dry); env(rum.gain, [[0, 0], [0.5, 0.5], [D - 0.3, 1.0], [D + 0.1, 0.85], [D + 0.9, 0.12], [D + 2, 0]]);
  const [roar, roarF] = noise('bandpass', 420, 0.6, dry); env(roar.gain, [[0, 0], [0.6, 0.1], [D - 0.4, 0.42], [D, 0.5], [D + 0.5, 0.1], [D + 1.3, 0]]); env(roarF.frequency, [[0, 300], [D, 760], [D + 1, 240]]);
  const [hiss] = noise('highpass', 2600, 0.5, dry); env(hiss.gain, [[0, 0], [1.2, 0.03], [D, 0.11], [D + 0.4, 0.04], [D + 1.4, 0]]);
  const [kick, kickF] = noise('bandpass', 1700, 0.8, dry); env(kick.gain, [[2.4, 0], [3.3, 0.1], [D, 0.3], [D + 0.5, 0.2], [D + 1.8, 0.03], [D + 2.4, 0]]); env(kickF.frequency, [[2.4, 2400], [D, 1500], [D + 2, 900]]);
  const sub0 = ac.createOscillator(); sub0.frequency.value = 38; const sub0g = mk(0, dry); env(sub0g.gain, [[0, 0], [1, 0.25], [D, 0.5], [D + 0.6, 0]]); sub0.connect(sub0g); sub0.start(t0); sub0.stop(t0 + D + 1);
  const th = ac.createOscillator(); th.frequency.setValueAtTime(64, t0 + D); th.frequency.exponentialRampToValueAtTime(26, t0 + D + 0.5); const thg = mk(0, dry);
  thg.gain.setValueAtTime(0.0001, t0 + D); thg.gain.linearRampToValueAtTime(1.0, t0 + D + 0.012); thg.gain.exponentialRampToValueAtTime(0.0001, t0 + D + 0.9); th.connect(thg); th.start(t0 + D); th.stop(t0 + D + 1);
  [4.55, 4.82, 5.0, 5.31, 5.44, 5.78].forEach((at, j) => { const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = 2200 + j * 310; const gn = mk(0, dry);
    gn.gain.setValueAtTime(0.0001, t0 + at); gn.gain.linearRampToValueAtTime(0.03, t0 + at + 0.002); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.05); o.connect(gn); o.start(t0 + at); o.stop(t0 + at + 0.07); });
  const [wind, windF] = noise('bandpass', 480, 0.9, bus); const lfo = ac.createOscillator(); lfo.frequency.value = 0.13; lfo.connect(mk(240, windF.frequency)); lfo.start(t0); lfo.stop(end);
  env(wind.gain, [[0, 0], [1.2, 0.1], [T_CAST, 0.13], [T_ORBIT, 0.1], [T_ORBIT + 1.5, 0.015]]);

  const swell = mk(0, bus); padLP.connect(swell); env(swell.gain, [[0, 0.2], [T_DOWN + 0.5, 0.3], [T_CAST, 0.55], [18, 0.74], [T_ORBIT, 1.05], [PEAK, 1.8], [28.4, 0.55]]);
  const pad = (dest, notes, a, b, vol, wave) => notes.forEach(n => [-5, 5].forEach(det => {

  pad(padLP, ['F2', 'C3', 'F3', 'A3'], 6, 12, 0.05);
  pad(padLP, ['C3', 'G3', 'C4', 'E4'], 12, 18, 0.05);
  pad(padLP, ['G2', 'D3', 'G3', 'B3'], 18, 24, 0.05);
  pad(padLP, ['A2', 'E3', 'A3', 'C4', 'E4', 'A4'], 24, 25.1, 0.055);
  pad(padLP, ['F2', 'C3', 'F3', 'A3', 'C4', 'F4'], 25.1, 26.1, 0.058);
  pad(padLP, ['G2', 'D3', 'G3', 'B3', 'D4', 'G4'], 26.1, 27.1, 0.062);
  pad(padLP, ['A2', 'E3', 'A3', 'C4', 'E4'], 27.1, 29.2, 0.05);
  const strLP = ac.createBiquadFilter(); strLP.type = 'lowpass'; env(strLP.frequency, [[20, 400], [PEAK, 3200], [28.2, 500]]);
  const strG = mk(0, bus); strLP.connect(strG); env(strG.gain, [[20, 0], [T_ORBIT, 0.35], [PEAK, 1.2], [28.2, 0]]);
  pad(strLP, ['G3', 'D4', 'G4'], 20, 24, 0.03, 'sawtooth'); pad(strLP, ['A3', 'E4', 'A4', 'E5'], 24, 25.1, 0.03, 'sawtooth');
  pad(strLP, ['A3', 'F4', 'C5', 'F5'], 25.1, 26.1, 0.03, 'sawtooth'); pad(strLP, ['B3', 'G4', 'D5', 'G5'], 26.1, 27.1, 0.032, 'sawtooth');
  const sub = ac.createOscillator(); sub.frequency.value = 55; const sg = mk(0, bus); env(sg.gain, [[20, 0], [PEAK, 0.42], [28.2, 0]]); sub.connect(sg); sub.start(t0 + 20); sub.stop(t0 + 28.4);

  /* --- piano with echo --- */
  const pbus = mk(1, bus), dl = ac.createDelay(1); dl.delayTime.value = 0.47; const fb = mk(0.4, dl); pbus.connect(dl); dl.connect(fb); dl.connect(bus);
  const note = (n, at, vol, dec = 2.2) => { const gn = mk(0, pbus);
    gn.gain.setValueAtTime(0.0001, t0 + at); gn.gain.linearRampToValueAtTime(vol, t0 + at + 0.006); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dec);
    [[1, 'triangle', 1], [2, 'sine', 0.3], [3, 'sine', 0.09]].forEach(([m, type, a]) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = N[n] * m;
      o.connect(mk(a, gn)); o.start(t0 + at); o.stop(t0 + at + dec + 0.05); }); };

  i = 0;
  for (let at = 24; at < 27; at += 0.2, i++) { const row = RUN.find(r => at >= r[0] && at < r[1]), v = lerp(0.18, 0.28, (at - 24) / 3); note(row[2][i % 4], at, v, 1.4);

function stopAudio() { if (ac) { try { ac.close(); } catch (e) {} ac = null; master = null; } }

/* ---------- transport ---------- */
const playBtn = document.getElementById('play'), fill = document.getElementById('fill'), label = document.getElementById('label');
const replayBtn = document.getElementById('replay'), muteBtn = document.getElementById('mute');
const fixed = (() => { const v = parseFloat(new URLSearchParams(location.search).get('t')); return isFinite(v) ? v : null; })();
let playing = false, ended = false, startAt = 0;
function play() { startAudio(); playing = true; ended = false; startAt = performance.now() + 60; playBtn.classList.add('hidden'); replayBtn.textContent = 'Restart'; }
function frame(now) {
  const clk = now / 1000; let t;
  if (fixed !== null) t = fixed;
  else if (playing) { t = Math.max(0, (now - startAt) / 1000); if (t >= DUR) { playing = false; ended = true; stopAudio(); replayBtn.textContent = 'Replay'; } }
  else t = ended ? DUR : 2.2;
  render(Math.min(t, DUR), playing || fixed !== null ? t : clk);
  const shown = playing || ended || fixed !== null ? Math.min(t, DUR) : 0;
  fill.style.width = (shown / DUR * 100) + '%';
  label.textContent = `0:${String(Math.floor(shown)).padStart(2, '0')} / 0:30`;
  requestAnimationFrame(frame);
}
playBtn.onclick = play; replayBtn.onclick = play;
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = 'Sound: ' + (muted ? 'off' : 'on'); if (master) master.gain.value = muted ? 0 : 0.9; };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); play(); } else if (e.key === 'm' || e.key === 'M') muteBtn.click(); });
if (fixed !== null) playBtn.style.display = 'none';
requestAnimationFrame(frame);
})();
